name: Bug report
description: Report an animation, atlas, preview, or documentation problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Ξ-105.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sprite sheet
        - Animation preview
        - Look direction
        - Validation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the state, direction, frame, or file path when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
